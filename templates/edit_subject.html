<!DOCTYPE html>
<html>
<head>
    <title>Edit Subject</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<h1>Edit Subject</h1>

<form method="POST">

<input type="text"
       name="subject_name"
       value="{{ subject[1] }}"
       required>

<br><br>

<input type="text"
       name="subject_code"
       value="{{ subject[2] }}"
       required>

<br><br>

<button type="submit">
    Update Subject
</button>

</form>

<br>

<a href="/subjects">
    Back to Subjects
</a>

</div>

</body>
</html>
