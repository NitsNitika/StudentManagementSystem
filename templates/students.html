<!DOCTYPE html>
<html>

<head>
    <title>Student Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>Student Management</h1>

<form method="POST">

    <input type="text"
           name="name"
           placeholder="Student Name"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <br><br>

    <input type="text"
           name="course"
           placeholder="Course"
           required>

    <br><br>

    <input type="text"
           name="semester"
           placeholder="Semester"
           required>

    <br><br>

    <button type="submit">
        Add Student
    </button>

</form>

<hr>

<h2>Student List</h2>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Course</th>
    <th>Semester</th>
    <th>Edit</th>
    <th>Delete</th>
</tr>

{% for student in students %}

<tr>

    <td>{{ student[0] }}</td>
    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>
    <td>{{ student[3] }}</td>
    <td>{{ student[4] }}</td>

    <td>
        <a href="/edit/{{ student[0] }}"
           class="edit-btn">
            Edit
        </a>
    </td>

    <td>
        <a href="/delete/{{ student[0] }}"
           class="delete-btn">
            Delete
        </a>
    </td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
